name: Update Map

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-map
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore auth cache
        uses: actions/cache@v4
        id: auth-cache
        with:
          path: auth-cache
          key: auth-cache-${{ github.run_id }}
          restore-keys: auth-cache-

      - name: Bootstrap auth from secret
        if: steps.auth-cache.outputs.cache-hit != 'true'
        env:
          AUTH_CACHE: ${{ secrets.AUTH_CACHE }}
        run: |
          mkdir -p auth-cache
          node -e "
            const fs = require('fs');
            const data = JSON.parse(Buffer.from(process.env.AUTH_CACHE, 'base64').toString());
            for (const [file, content] of Object.entries(data)) {
              fs.writeFileSync('auth-cache/' + file, content);
            }
          "

      - name: Restore previous render
        uses: actions/cache@v4
        with:
          path: output
          key: render-v3-${{ github.run_id }}
          restore-keys: render-v3-

      - name: Get Minecraft version
        id: mc-version
        run: |
          MANIFEST=$(curl -sS "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json")
          echo "$MANIFEST" | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf-8'));
            const v = d.versions.find(v => v.id === d.latest.release);
            console.log('version=' + d.latest.release);
            console.log('version_url=' + v.url);
          " >> $GITHUB_OUTPUT

      - name: Cache uNmINeD CLI
        uses: actions/cache@v4
        id: unmined-cache
        with:
          path: /opt/unmined-cli
          key: unmined-cli-${{ steps.mc-version.outputs.version }}

      - name: Install uNmINeD CLI
        if: steps.unmined-cache.outputs.cache-hit != 'true'
        run: |
          curl -sS "https://unmined.net/download/unmined-cli-linux-x64-dev/" | tar -xz -C /opt
          mv /opt/unmined-cli* /opt/unmined-cli

      - name: Add uNmINeD to PATH
        run: echo "/opt/unmined-cli" >> $GITHUB_PATH

      - name: Cache Minecraft JAR
        uses: actions/cache@v4
        id: jar-cache
        with:
          path: /tmp/minecraft.jar
          key: minecraft-jar-${{ steps.mc-version.outputs.version }}

      - name: Download Minecraft client JAR
        if: steps.jar-cache.outputs.cache-hit != 'true'
        run: |
          CLIENT_URL=$(curl -sS "${{ steps.mc-version.outputs.version_url }}" \
            | node -e "const d=JSON.parse(require('fs').readFileSync('/dev/stdin','utf-8'));console.log(d.downloads.client.url)")
          curl -sS "$CLIENT_URL" -o /tmp/minecraft.jar
          echo "Downloaded Minecraft ${{ steps.mc-version.outputs.version }} client JAR"

      - name: Download and render
        env:
          REALM_ID: ${{ secrets.REALM_ID }}
          AUTH_CACHE_PATH: ./auth-cache
          BACKUP_PATH: ./backups
          OUTPUT_PATH: ./output
          MINECRAFT_JAR: /tmp/minecraft.jar
        run: npm run update

      - name: Copy favicon
        run: cp public/favicon.png output/favicon.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4